name: COSHUMA Affiliate Disclosure Publish Guard

on:
  workflow_run:
    workflows: ["COSHUMA Site Build & Deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: coshuma-affiliate-disclosure-publish
  cancel-in-progress: true

jobs:
  verify-disclosures:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed gh-pages bundle
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify consumer affiliate disclosure policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          policy = root / 'affiliate-disclosure.html'
          home_path = root / 'index.html'
          if not policy.exists() or not home_path.exists():
              raise RuntimeError('Expected homepage or affiliate disclosure policy page is missing')

          home = home_path.read_text(encoding='utf-8')
          if home.count('data-site-affiliate-disclosure="global"') != 1:
              raise RuntimeError('Homepage must contain exactly one global affiliate disclosure marker')
          if len(re.findall(r'Affiliate\s+disclosure\s*:', home, re.I)) != 1:
              raise RuntimeError('Homepage must contain exactly one global affiliate disclosure')
          if 'data-affiliate-disclosure="page"' in home:
              raise RuntimeError('Homepage must not contain a page-level affiliate disclosure marker')

          cta = re.compile(r'<a\b[^>]*\bdata-cta=["\']affiliate["\'][^>]*>', re.I | re.S)
          notice = re.compile(r'Affiliate\s+disclosure\s*:', re.I)
          sponsored = re.compile(r'<a\b[^>]*\brel=["\'][^"\']*\bsponsored\b[^"\']*["\'][^>]*>', re.I | re.S)
          marker = 'data-affiliate-disclosure="page"'

          pages_checked = 0
          affiliate_pages = 0
          affiliate_ctas = 0
          sponsored_links = 0

          for path in root.rglob('*.html'):
              rel = path.as_posix()
              if rel in ('index.html', 'affiliate-disclosure.html'):
                  continue
              html = path.read_text(encoding='utf-8')
              first_cta = cta.search(html)
              ctas = cta.findall(html)
              marker_count = html.count(marker)
              notice_count = len(notice.findall(html))
              if 'data-site-affiliate-disclosure="global"' in html:
                  raise RuntimeError(f'{rel}: global affiliate disclosure marker must remain homepage-only')

              if first_cta:
                  affiliate_pages += 1
                  affiliate_ctas += len(ctas)
                  if marker_count != 1 or notice_count != 1:
                      raise RuntimeError(f'{rel}: affiliate CTA page must contain exactly one consumer disclosure')
                  if html.index(marker) >= first_cta.start():
                      raise RuntimeError(f'{rel}: consumer affiliate disclosure must appear before the first affiliate CTA')
              elif marker_count or notice_count:
                  raise RuntimeError(f'{rel}: page without an affiliate CTA must not contain a page-level affiliate disclosure')

              sponsored_links += len(sponsored.findall(html))
              pages_checked += 1

          if affiliate_pages == 0 or affiliate_ctas == 0 or sponsored_links == 0:
              raise RuntimeError('Affiliate CTA/sponsored attribution inventory unexpectedly disappeared')

          print(
              f'PASS consumer affiliate disclosure policy: pages_checked={pages_checked} '
              f'affiliate_pages={affiliate_pages} affiliate_ctas={affiliate_ctas} '
              f'sponsored_links={sponsored_links} homepage_global_notice=1'
          )
          PY
