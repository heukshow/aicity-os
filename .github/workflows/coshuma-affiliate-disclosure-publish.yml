name: COSHUMA Affiliate Disclosure Publish Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coshuma-affiliate-disclosure-publish.yml'
  workflow_run:
    workflows: ["COSHUMA Site Build & Deploy"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: coshuma-affiliate-disclosure-publish
  cancel-in-progress: true

jobs:
  disclose-and-publish:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed gh-pages bundle
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Enforce homepage-only general affiliate disclosure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          POLICY_PAGE = 'affiliate-disclosure.html'
          HOME_NOTICE = (
              '<p data-site-affiliate-disclosure="global" '
              'style="max-width:72rem;margin:0 auto;padding:0 1.5rem 1.5rem;color:#94a3b8;font-size:12px;line-height:1.6">'
              'Affiliate disclosure: COSHUMA may earn a commission from some links, at no extra cost to you. '
              '<a href="/affiliate-disclosure.html" style="text-decoration:underline">Details</a>.'
              '</p>'
          )

          marked_block = re.compile(
              r'<(?P<tag>p|span|div|aside|section)\b[^>]*(?:data-affiliate-disclosure|data-site-affiliate-disclosure)=["\'][^"\']*["\'][^>]*>.*?</(?P=tag)>',
              re.I | re.S,
          )
          generic_blocks = [
              re.compile(
                  rf'<{tag}\b[^>]*>(?:(?!</{tag}>).)*(?:Affiliate\s+disclosure\s*:|COSHUMA\s+may\s+earn\s+(?:(?:an\s+affiliate|a)\s+)?commission)(?:(?!</{tag}>).)*</{tag}>',
                  re.I | re.S,
              )
              for tag in ('p', 'span', 'div', 'aside', 'section')
          ]
          inline_disclosure = re.compile(r'\s*Affiliate\s+disclosure\s*:\s*[^<]*', re.I)
          inline_commission = re.compile(
              r'\s*COSHUMA\s+may\s+earn\s+(?:(?:an\s+affiliate|a)\s+)?commission[^<]*',
              re.I,
          )
          home_semantic_disclosure = re.compile(
              r'<li><strong([^>]*)>Clear disclosure:</strong>\s*some outbound links may earn COSHUMA a commission, without changing the buyer\'s price\.</li>',
              re.I,
          )
          home_internal_link_copy = re.compile(
              r'<li><strong([^>]*)>Separate link verification:</strong>\s*affiliate destinations are verified independently from editorial pricing sources\.</li>',
              re.I,
          )

          def strip_general_disclosures(html):
              html = marked_block.sub('', html)
              for pattern in generic_blocks:
                  html = pattern.sub('', html)
              html = inline_disclosure.sub('', html)
              html = inline_commission.sub('', html)
              return html

          changed = 0
          checked = 0
          inner_pages = 0

          for path in ROOT.rglob('*.html'):
              rel = path.as_posix()
              html = path.read_text(encoding='utf-8')
              before = html
              checked += 1

              if rel == POLICY_PAGE:
                  continue

              html = strip_general_disclosures(html)

              if rel == 'index.html':
                  html = home_semantic_disclosure.sub(
                      r'<li><strong\1>Final-term check:</strong> pricing, eligibility and vendor terms can change, so confirm them before purchasing.</li>',
                      html,
                  )
                  html = home_internal_link_copy.sub(
                      r'<li><strong\1>Direct vendor links:</strong> outbound destinations are checked before publication.</li>',
                      html,
                  )
                  if '</body>' not in html:
                      raise RuntimeError('Homepage closing body tag missing')
                  html = html.replace('</body>', HOME_NOTICE + '\n</body>', 1)
                  if html.count('data-site-affiliate-disclosure="global"') != 1:
                      raise RuntimeError('Homepage must contain exactly one global affiliate disclosure')
                  if len(re.findall(r'Affiliate\s+disclosure\s*:', html, re.I)) != 1:
                      raise RuntimeError('Homepage must contain exactly one general affiliate disclosure')
                  if re.search(r'Separate\s+link\s+verification|affiliate\s+destinations\s+are\s+verified\s+independently', html, re.I):
                      raise RuntimeError('Homepage contains customer-visible internal link-verification wording')
              else:
                  inner_pages += 1
                  if re.search(r'Affiliate\s+disclosure\s*:', html, re.I):
                      raise RuntimeError(f'{rel}: repeated general affiliate disclosure remains')
                  if re.search(r'COSHUMA\s+may\s+earn\s+(?:(?:an\s+affiliate|a)\s+)?commission', html, re.I):
                      raise RuntimeError(f'{rel}: repeated commission disclosure remains')
                  if re.search(r'data-(?:site-)?affiliate-disclosure\s*=', html, re.I):
                      raise RuntimeError(f'{rel}: repeated disclosure marker remains')

              if html != before:
                  path.write_text(html, encoding='utf-8')
                  changed += 1

          if checked == 0 or not Path('index.html').exists() or not Path(POLICY_PAGE).exists():
              raise RuntimeError('Expected production HTML bundle, homepage, or disclosure policy page is missing')

          print(
              f'Homepage-only affiliate disclosure publish guard: checked={checked} '
              f'inner_pages={inner_pages} files_changed={changed} homepage_notice=1 repeated_inner_notices=0'
          )
          PY

      - name: Verify public disclosure policy and preserved affiliate attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          policy = Path('affiliate-disclosure.html')
          home = Path('index.html').read_text(encoding='utf-8')
          if not policy.exists():
              raise RuntimeError('Dedicated affiliate disclosure policy page is missing')
          if home.count('data-site-affiliate-disclosure="global"') != 1:
              raise RuntimeError('Homepage must contain exactly one global disclosure marker')
          if len(re.findall(r'Affiliate\s+disclosure\s*:', home, re.I)) != 1:
              raise RuntimeError('Homepage must contain exactly one general disclosure')

          affiliate_ctas = 0
          sponsored_links = 0
          for path in Path('.').rglob('*.html'):
              rel = path.as_posix()
              if rel == 'affiliate-disclosure.html':
                  continue
              html = path.read_text(encoding='utf-8')
              affiliate_ctas += len(re.findall(r'<a\b[^>]*\bdata-cta=["\']affiliate["\'][^>]*>', html, re.I | re.S))
              sponsored_links += len(re.findall(r'<a\b[^>]*\brel=["\'][^"\']*\bsponsored\b[^"\']*["\'][^>]*>', html, re.I | re.S))
              if rel != 'index.html':
                  if re.search(r'Affiliate\s+disclosure\s*:', html, re.I):
                      raise RuntimeError(f'{rel}: repeated general disclosure remains')
                  if re.search(r'data-(?:site-)?affiliate-disclosure\s*=', html, re.I):
                      raise RuntimeError(f'{rel}: repeated disclosure marker remains')

          if affiliate_ctas == 0 or sponsored_links == 0:
              raise RuntimeError('Affiliate CTA/sponsored attribution inventory unexpectedly disappeared')
          print(
              f'PASS homepage-only disclosure verification: affiliate_ctas={affiliate_ctas} '
              f'sponsored_links={sponsored_links} homepage_notice=1 repeated_inner_notices=0'
          )
          PY

      - name: Commit homepage-only disclosure-compliant production bundle
        run: |
          if git diff --quiet; then
            echo 'Homepage-only disclosure-compliant bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'deploy: enforce homepage-only affiliate disclosure'
          git push origin HEAD:gh-pages
