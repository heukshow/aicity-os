name: COSHUMA Site Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'projects/GlobalSaaSHub/src/**'
      - 'projects/GlobalSaaSHub/public/**'
      - 'projects/GlobalSaaSHub/scripts/**'
      - 'projects/GlobalSaaSHub/data/approved-tracking-2026-09-08.json'
      - 'projects/GlobalSaaSHub/data/pictory-attribution-verification-2026-09-09.md'
      - 'projects/GlobalSaaSHub/scripts/approved_tracking_evidence.mjs'
      - 'projects/GlobalSaaSHub/scripts/apply_verified_buyer_deeplinks.mjs'
      - 'projects/GlobalSaaSHub/scripts/browser_followup_evidence.mjs'
      - 'projects/GlobalSaaSHub/scripts/reconcile_tagshop_approved_tracking.mjs'
      - 'projects/GlobalSaaSHub/scripts/reconcile_promoted_affiliate_states_2026_09_10.mjs'
      - 'projects/GlobalSaaSHub/data/affiliate-browser-followup-wave3-2026-09-08.json'
      - 'projects/GlobalSaaSHub/data/affiliate-submission-batch-2026-09-08.json'
      - 'projects/GlobalSaaSHub/data/standalone_tool_pages.json'
      - 'projects/GlobalSaaSHub/data/tool_value_playbooks*.json'
      - 'projects/GlobalSaaSHub/data/tools.json'
      - 'projects/GlobalSaaSHub/data/tools.next.json'
      - 'projects/GlobalSaaSHub/scripts/sync_verified_affiliates.mjs'
      - 'projects/GlobalSaaSHub/scripts/sync_latest_affiliate_states.mjs'
      - 'projects/GlobalSaaSHub/scripts/tests/tagshop-consent.test.mjs'
      - 'projects/GlobalSaaSHub/data/tagshop-submission-2026-09-08.json'
      - 'projects/GlobalSaaSHub/scripts/monetize_verified_compare_links.mjs'
      - 'projects/GlobalSaaSHub/scripts/build_search_comparisons.mjs'
      - 'projects/GlobalSaaSHub/scripts/inject_buyer_decision_boxes.mjs'
      - 'projects/GlobalSaaSHub/scripts/polish_public_copy.py'
      - 'projects/GlobalSaaSHub/scripts/guard_public_copy.py'
      - 'projects/GlobalSaaSHub/scripts/public-copy-templates/**'
      - 'projects/GlobalSaaSHub/scripts/tests/test_public_copy.py'
      - 'projects/GlobalSaaSHub/scripts/tests/test_link_integrity.py'
      - 'projects/GlobalSaaSHub/scripts/ensure_best_pages_in_sitemap.py'
      - 'projects/GlobalSaaSHub/scripts/surface_verified_kittl_commercial_guide.py'
      - 'projects/GlobalSaaSHub/scripts/sync_revenue_seo.py'
      - 'projects/GlobalSaaSHub/scripts/tests/test_revenue_seo.py'
      - 'projects/GlobalSaaSHub/scripts/inject_pictory_partner_offer.py'
      - 'projects/GlobalSaaSHub/scripts/reconcile_pictory_attribution_2026_09_10.py'
      - 'projects/GlobalSaaSHub/scripts/optimize_pictory_trial_conversion.py'
      - 'projects/GlobalSaaSHub/scripts/inject_jotform_partner_offer.py'
      - 'projects/GlobalSaaSHub/scripts/apply_omnisend_revenue_patch.py'
      - 'projects/GlobalSaaSHub/scripts/finalize_omnisend_tracking.py'
      - 'projects/GlobalSaaSHub/scripts/reconcile_beefree_tracking_2026_09_09.py'
      - 'projects/GlobalSaaSHub/scripts/publish_affiliate_audit.mjs'
      - 'projects/GlobalSaaSHub/index.html'
      - 'projects/GlobalSaaSHub/package.json'
      - 'projects/GlobalSaaSHub/package-lock.json'
      - 'projects/GlobalSaaSHub/vite.config.*'
      - '.github/workflows/coshuma-site-deploy.yml'
      - '.github/workflows/coshuma-affiliate-disclosure-publish.yml'
  workflow_dispatch:

concurrency:
  group: coshuma-site-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Capture the actual current-main source
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "COSHUMA_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/GlobalSaaSHub/package-lock.json

      - name: Install dependencies
        working-directory: projects/GlobalSaaSHub
        run: npm ci

      - name: Sync verified affiliate revenue data
        working-directory: projects/GlobalSaaSHub
        run: |
          node scripts/sync_verified_affiliates.mjs
          node scripts/sync_latest_affiliate_states.mjs
          node scripts/reconcile_tagshop_approved_tracking.mjs
          node scripts/reconcile_promoted_affiliate_states_2026_09_10.mjs
          python scripts/affiliate_lifecycle_guard.py --sync-next
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tools = JSON.parse(fs.readFileSync('data/tools.json', 'utf8'));
          const expected = new Map([
            ['murf-ai', 'https://get.murf.ai/fqac0vixj0qs'],
            ['unbounce', 'https://unbounce.partnerlinks.io/5ubjnt8lluqi'],
            ['helpdesk', 'https://www.helpdesk.com/?a=8IetMhQvR&utm_campaign=pp_helpdesk-default&utm_source=PP&d=14'],
            ['voibe', 'https://www.getvoibe.com/?aff=G5Yr5D'],
            ['time2book', 'https://time2book.me?aff=9TzesqKi'],
            ['taskip', 'https://taskip.net/?atp=qnV3mw'],
            ['clickfunnels', 'https://www.clickfunnels.com/signup-flow?aff=b57f3056884d05b842f607e32347df542821875bbe3209a214141aa32a210532'],
            ['tagshop-ai', 'https://tagshop.ai?via=coshuma-22501e'],
          ]);
          for (const [id, url] of expected) {
            const tool = tools.find((item) => item.id === id);
            if (!tool || tool.affiliate_verified !== true || tool.affiliate_status !== 'approved_tracking' || tool.affiliate_url !== url) {
              throw new Error(`Verified affiliate sync failed for ${id}`);
            }
          }
          const expectedStates = new Map([
            ['gravity-forms', 'approved_tracking'],
            ['sendcloud', 'approved_tracking'],
            ['apollo', 'rejected'],
            ['ai-video-cut', 'application_submitted'],
            ['fillout', 'approved_tracking'],
            ['beefree', 'approved_tracking'],
            ['gumloop', 'application_submitted'],
            ['pipedrive', 'pending'],
            ['monday-com', 'pending'],
            ['kittl', 'approved_tracking'],
          ]);
          for (const [id, status] of expectedStates) {
            const tool = tools.find((item) => item.id === id);
            if (tool && tool.affiliate_status !== status) {
              throw new Error(`Affiliate state sync failed for ${id}: ${tool.affiliate_status} !== ${status}`);
            }
          }
          NODE

      - name: Refresh and verify private affiliate admin snapshot
        working-directory: projects/GlobalSaaSHub
        run: |
          node scripts/generate_admin_snapshot.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tools = JSON.parse(fs.readFileSync('data/tools.json', 'utf8'));
          const snapshot = JSON.parse(fs.readFileSync('worker/src/admin-snapshot.json', 'utf8'));
          const actual = new Map(snapshot.affiliates.map((item) => [item.id, item]));
          for (const tool of tools.filter((item) => item.affiliate_verified === true)) {
            const row = actual.get(tool.id);
            if (!row || row.status !== (tool.affiliate_status || 'unknown') || row.url !== (tool.affiliate_url || null)) {
              throw new Error(`Private affiliate snapshot mismatch for ${tool.id}`);
            }
          }
          NODE

      - name: Monetize verified tool and comparison CTAs
        working-directory: projects/GlobalSaaSHub
        run: node scripts/monetize_verified_compare_links.mjs

      - name: Polish generated public copy
        run: python projects/GlobalSaaSHub/scripts/polish_public_copy.py

      - name: Inject current Pictory partner offer
        run: python projects/GlobalSaaSHub/scripts/inject_pictory_partner_offer.py

      - name: Inject confirmed Jotform partner links
        run: python projects/GlobalSaaSHub/scripts/inject_jotform_partner_offer.py

      - name: Index buyer-intent hubs in sitemap
        run: python projects/GlobalSaaSHub/scripts/ensure_best_pages_in_sitemap.py

      - name: Publish live affiliate coverage audit
        working-directory: projects/GlobalSaaSHub
        run: node scripts/publish_affiliate_audit.mjs

      - name: Build production bundle
        working-directory: projects/GlobalSaaSHub
        run: npm run build

      - name: Verify approved tracking state and built CTAs
        working-directory: projects/GlobalSaaSHub
        run: |
          python scripts/tests/test_revenue_seo.py dist
          python scripts/tests/test_link_integrity.py
          node scripts/verify_approved_tracking.mjs
          node scripts/tests/browser-followup.test.mjs
          node scripts/tests/tagshop-consent.test.mjs

      - name: Verify COSHUMA bundle identity
        run: |
          set -e
          test -f projects/GlobalSaaSHub/dist/index.html
          test -f projects/GlobalSaaSHub/.private-ops/admin-affiliate-audit.json
          test ! -e projects/GlobalSaaSHub/dist/admin-affiliate-audit.json
          grep -q 'COSHUMA' projects/GlobalSaaSHub/dist/index.html
          if grep -R -I -i -q -F 'websilonsg@gmail.com' projects/GlobalSaaSHub/dist --include='*.html' 2>/dev/null; then
            echo 'Private email address detected in the public production bundle.'
            exit 1
          fi
          grep -q -F 'support@coshuma.com' projects/GlobalSaaSHub/dist/privacy.html
          grep -q -F 'support@coshuma.com' projects/GlobalSaaSHub/dist/refund.html
          if grep -R -q 'GlobalSaaSHub' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare 2>/dev/null; then
            echo 'Legacy GlobalSaaSHub branding detected in generated production pages.'
            exit 1
          fi
          if grep -R -q 'Side-by-Side Head-to-Head Comparison' projects/GlobalSaaSHub/dist/compare 2>/dev/null; then
            echo 'Legacy comparison boilerplate detected in production pages.'
            exit 1
          fi
          while IFS= read -r page; do
            if ! grep -q 'COSHUMA20' "$page"; then
              echo "Pictory monetized page missing current partner offer: $page"
              exit 1
            fi
          done < <(grep -R -l -F 'https://pictory.ai?fpr=sangkwon-an23' projects/GlobalSaaSHub/dist --include='*.html' || true)
          test -f projects/GlobalSaaSHub/dist/tool/pictory.html
          test -f projects/GlobalSaaSHub/dist/best/pictory-free-trial-pricing.html
          grep -q -F 'https://pictory.ai?fpr=sangkwon-an23' projects/GlobalSaaSHub/dist/tool/pictory.html
          grep -q -F 'Start 14-day free trial' projects/GlobalSaaSHub/dist/tool/pictory.html
          grep -q -F 'no credit card' projects/GlobalSaaSHub/dist/tool/pictory.html
          grep -q -F 'Start 14-day free trial' projects/GlobalSaaSHub/dist/best/pictory-free-trial-pricing.html
          grep -q -F 'no credit card' projects/GlobalSaaSHub/dist/best/pictory-free-trial-pricing.html
          if grep -R -q -F 'href="https://unbounce.com/"' projects/GlobalSaaSHub/dist/compare 2>/dev/null; then
            echo 'Unbounce comparison CTA still points to the non-revenue homepage.'
            exit 1
          fi
          grep -R -q -F 'https://unbounce.partnerlinks.io/5ubjnt8lluqi' projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://get.murf.ai/fqac0vixj0qs' projects/GlobalSaaSHub/dist/assets
          grep -R -q -F 'https://unbounce.partnerlinks.io/5ubjnt8lluqi' projects/GlobalSaaSHub/dist/assets
          grep -R -q -F 'https://www.helpdesk.com/?a=8IetMhQvR&utm_campaign=pp_helpdesk-default&utm_source=PP&d=14' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://www.getvoibe.com/?aff=G5Yr5D' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://time2book.me?aff=9TzesqKi' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://taskip.net/?atp=qnV3mw' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://www.clickfunnels.com/signup-flow?aff=b57f3056884d05b842f607e32347df542821875bbe3209a214141aa32a210532' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          grep -R -q -F 'https://tagshop.ai?via=coshuma-22501e' projects/GlobalSaaSHub/dist/tool projects/GlobalSaaSHub/dist/compare
          test -f projects/GlobalSaaSHub/dist/tool/jotform.html
          grep -q -F 'https://www.jotform.com/ai/agents/?partner=coshuma' projects/GlobalSaaSHub/dist/tool/jotform.html
          if grep -q -F 'https://link.jotform.com/17STYVOunG?username=AnSangkwon' projects/GlobalSaaSHub/dist/tool/jotform.html; then
            echo 'Jotform production page still contains the legacy onboarding redirect instead of the confirmed customer-facing partner URL.'
            exit 1
          fi
          test "$(grep -o 'data-site-affiliate-disclosure="global"' projects/GlobalSaaSHub/dist/index.html | wc -l)" -eq 1
          test "$(grep -io 'Affiliate disclosure:' projects/GlobalSaaSHub/dist/index.html | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('projects/GlobalSaaSHub/dist')
          cta = re.compile(r'<a\b[^>]*\bdata-cta=["\']affiliate["\'][^>]*>', re.I)
          notice = re.compile(r'affiliate\s+disclosure\s*:', re.I)
          marker = 'data-affiliate-disclosure="page"'
          exempt = {'index.html', 'affiliate-disclosure.html'}
          checked = 0
          for page in root.rglob('*.html'):
              rel = page.relative_to(root).as_posix()
              if rel in exempt:
                  continue
              html = page.read_text(encoding='utf-8')
              first_cta = cta.search(html)
              marker_count = html.count(marker)
              notice_count = len(notice.findall(html))
              if first_cta:
                  if marker_count != 1 or notice_count != 1:
                      raise SystemExit(f'{rel}: affiliate CTA page must contain exactly one consumer disclosure')
                  first_notice = html.index(marker)
                  if first_notice >= first_cta.start():
                      raise SystemExit(f'{rel}: consumer affiliate disclosure must appear before first affiliate CTA')
              elif marker_count or notice_count:
                  raise SystemExit(f'{rel}: page without an affiliate CTA must not contain a page-level affiliate disclosure')
              checked += 1
          print(f'PASS: consumer affiliate disclosure policy verified across {checked} built pages')
          PY
          test -f projects/GlobalSaaSHub/dist/affiliate-disclosure.html
          for page in projects/GlobalSaaSHub/dist/best/*.html; do
            [ -e "$page" ] || continue
            slug=$(basename "$page")
            if ! grep -q "https://coshuma.com/best/$slug" projects/GlobalSaaSHub/dist/sitemap.xml; then
              echo "Buyer hub missing from sitemap: $slug"
              exit 1
            fi
          done
          for page in projects/GlobalSaaSHub/dist/*.html; do
            [ -e "$page" ] || continue
            if ! grep -q 'data-cta="affiliate"' "$page"; then
              continue
            fi
            slug=$(basename "$page")
            if ! grep -q "https://coshuma.com/$slug" projects/GlobalSaaSHub/dist/sitemap.xml; then
              echo "Root revenue page missing from sitemap: $slug"
              exit 1
            fi
          done
          grep -q 'coshuma.com' projects/GlobalSaaSHub/dist/CNAME

      - name: Persist reconciled affiliate source state
        run: |
          set -e
          git fetch origin main
          if ! git diff --quiet "$COSHUMA_SOURCE_SHA" origin/main -- projects/GlobalSaaSHub .github/workflows/coshuma-site-deploy.yml ':!projects/GlobalSaaSHub/data/operations_registry.json' ':!projects/GlobalSaaSHub/data/revenue-leakage-audit.json' ':!projects/GlobalSaaSHub/data/revenue-reconciliation-queue.json'; then
            echo 'Main changed during build; refuse stale state persistence and publication.'
            exit 1
          fi
          files=(
            projects/GlobalSaaSHub/data/tools.json
            projects/GlobalSaaSHub/data/tools.next.json
            projects/GlobalSaaSHub/data/affiliate_outreach_state.json
            projects/GlobalSaaSHub/data/browser_required_queue.json
            projects/GlobalSaaSHub/worker/src/admin-snapshot.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'Affiliate source state already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "${files[@]}"
            git commit -m 'data: persist reconciled affiliate source state [skip ci]'
            git fetch origin main
            remote_subject="$(git log -1 --format=%s origin/main)"
            remote_parent="$(git rev-parse origin/main^ 2>/dev/null || true)"
            if [ "$remote_subject" = 'data: persist reconciled affiliate source state [skip ci]' ] \
              && [ "$remote_parent" = "$COSHUMA_SOURCE_SHA" ]; then
              echo 'A state commit already exists on this exact content SHA; preserving the newer persisted state.'
            elif git diff --quiet origin/main HEAD -- "${files[@]}"; then
              echo 'Affiliate source state was already persisted by a newer main commit.'
            else
              git rebase --autostash origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Refuse to publish if a newer content change reached main
        id: freshness
        run: |
          git fetch origin main
          if git diff --quiet HEAD origin/main -- projects/GlobalSaaSHub .github/workflows/coshuma-site-deploy.yml ':!projects/GlobalSaaSHub/data/operations_registry.json' ':!projects/GlobalSaaSHub/data/revenue-leakage-audit.json' ':!projects/GlobalSaaSHub/data/revenue-reconciliation-queue.json'; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Superseded by newer main content; its current-main deployment owns publication.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish complete Vite dist to gh-pages
        if: steps.freshness.outputs.current == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./projects/GlobalSaaSHub/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: sync COSHUMA production bundle from ${{ steps.source.outputs.sha }}'
