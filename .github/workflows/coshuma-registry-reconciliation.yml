name: COSHUMA Registry Reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: ['COSHUMA Release Verification']
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: coshuma-registry-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Reconcile only existing records from exact PR and release evidence
        working-directory: projects/GlobalSaaSHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/reconcile_operations_registry.py --write
