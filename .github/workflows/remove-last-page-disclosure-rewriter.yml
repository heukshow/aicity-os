name: Remove last page disclosure rewriter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-last-page-disclosure-rewriter.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Convert disclosure rewrites to removals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('projects/GlobalSaaSHub')
          p = root / 'scripts/guard_customer_only_copy.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'It keeps exact outbound URLs and required disclosures intact while removing\ninternal affiliate, attribution, KPI and workflow language from buyer-facing copy.',
              'It keeps exact outbound URLs intact while removing page-level affiliate disclosures,\ninternal attribution, KPI and workflow language from buyer-facing copy.'
          )

          # Any exact public-copy mapping whose source is a page-level affiliate
          # disclosure must remove it, never rewrite it into another disclosure.
          lines = text.splitlines()
          out = []
          changed = 0
          for line in lines:
              if '"Affiliate disclosure:' in line and '": "Affiliate disclosure:' in line:
                  prefix = line.split(': "Affiliate disclosure:', 1)[0]
                  line = prefix + ': "",'
                  changed += 1
              out.append(line)
          text = '\n'.join(out) + ('\n' if p.read_text(encoding='utf-8').endswith('\n') else '')

          # Also remove any tuple replacement that explicitly turns one affiliate
          # disclosure sentence into another within this final customer-copy pass.
          text = re.sub(
              r'(\n\s*["\']Affiliate disclosure:[^\n]*["\'],\n)\s*["\']Affiliate disclosure:[^\n]*["\'](,)',
              lambda m: m.group(1) + '        ""' + m.group(2),
              text,
          )
          p.write_text(text, encoding='utf-8')

          # One-shot migration removes itself.
          Path('.github/workflows/remove-last-page-disclosure-rewriter.yml').unlink()

          remaining = []
          for line in p.read_text(encoding='utf-8').splitlines():
              if 'Affiliate disclosure:' in line and ': "Affiliate disclosure:' in line:
                  remaining.append(line.strip())
          if remaining:
              raise SystemExit('Disclosure-to-disclosure rewrite remains: ' + ' | '.join(remaining[:5]))
          print(f'guard_customer_only_copy disclosure rewrites removed={changed}')
          PY
      - name: Commit permanent fix
        run: |
          git config user.name 'COSHUMA automation'
          git config user.email 'support@coshuma.com'
          git add -A
          git commit -m 'Remove final page-level affiliate disclosure rewriter'
          git push origin HEAD:main
