name: COSHUMA Revenue Leakage Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coshuma-revenue-leakage-audit.yml'
      - 'projects/GlobalSaaSHub/data/revenue-truth-2026-09-11.json'
      - 'projects/GlobalSaaSHub/data/revenue-truth-supplement-2026-09-18.json'
      - 'projects/GlobalSaaSHub/data/tools.json'
      - 'projects/GlobalSaaSHub/data/approved-tracking-2026-09-08.json'
      - 'projects/GlobalSaaSHub/scripts/generate_revenue_inventory.mjs'
      - 'projects/GlobalSaaSHub/scripts/revenue-program-observations.mjs'
      - 'projects/GlobalSaaSHub/worker/src/revenue-observations.json'
      - 'projects/GlobalSaaSHub/scripts/generate_revenue_leakage_audit.mjs'
      - 'projects/GlobalSaaSHub/scripts/generate_revenue_reconciliation_queue.mjs'
      - 'projects/GlobalSaaSHub/scripts/validate_revenue_truth.mjs'

permissions:
  contents: read

concurrency:
  group: coshuma-revenue-leakage-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate evidence-backed revenue truth
        working-directory: projects/GlobalSaaSHub
        run: |
          node scripts/validate_revenue_truth.mjs
          node scripts/tests/revenue-program-observations.test.mjs
      - name: Rebuild private revenue inventory
        working-directory: projects/GlobalSaaSHub
        run: node scripts/generate_revenue_inventory.mjs
      - name: Generate revenue leakage audit
        working-directory: projects/GlobalSaaSHub
        run: node scripts/generate_revenue_leakage_audit.mjs
      - name: Generate account-group reconciliation queue
        working-directory: projects/GlobalSaaSHub
        run: node scripts/generate_revenue_reconciliation_queue.mjs
      - name: Verify leakage audit invariants
        working-directory: projects/GlobalSaaSHub
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('data/revenue-leakage-audit.json','utf8'));
          const queue = JSON.parse(fs.readFileSync('data/revenue-reconciliation-queue.json','utf8'));
          if (audit.policy?.unknown_is_zero !== false) throw new Error('unknown must remain unknown');
          if (audit.policy?.public_output !== false) throw new Error('revenue leakage audit must remain private/internal');
          if (!Array.isArray(audit.rows) || !audit.rows.length) throw new Error('audit rows missing');
          for (const row of audit.rows) {
            if (!row.tracking_url) throw new Error(`approved row missing tracking URL: ${row.id}`);
            if (!['P0_UNCHECKED','P1_STALE','P1_PARTIAL','P2_COVERED'].includes(row.priority)) throw new Error(`bad priority: ${row.id}`);
          }
          if (!Array.isArray(queue.tasks) || queue.tasks.length !== audit.summary.account_groups_to_check) throw new Error('reconciliation queue does not match audit groups');
          console.log(`PASS revenue leakage audit: ${audit.summary.approved_tracked_tools} approved routes; ${audit.summary.unchecked_or_stale_or_partial} need metric reconciliation across ${audit.summary.account_groups_to_check} account groups.`);
          NODE
      - name: Verify private outputs remain ephemeral
        run: |
          set -e
          for file in             projects/GlobalSaaSHub/data/revenue-leakage-audit.json             projects/GlobalSaaSHub/data/revenue-reconciliation-queue.json
          do
            git check-ignore -q "$file"
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "::error::$file must not be tracked in this public repository."
              exit 1
            fi
          done
          echo 'Private revenue audit outputs were generated for this run only and were not persisted.'
