name: Daily Automated Build & Deploy (GlobalSaaSHub)

on:
  # schedule:
  #   - cron: '7 0 * * *'
  workflow_dispatch:


concurrency:
  group: daily-build-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'projects/GlobalSaaSHub/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd projects/GlobalSaaSHub
          npm ci

      - name: Execute Autonomous Tavily & Gemini AI Tool Discovery
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python projects/GlobalSaaSHub/scripts/auto_aggregator.py

      - name: Execute Autonomous Recategorization on Sandbox Candidate
        run: |
          python projects/GlobalSaaSHub/scripts/recategorize_tools.py

      - name: Run Strict Candidate Dataset Validation Audit (validate_data.py)
        run: |
          python projects/GlobalSaaSHub/scripts/validate_data.py

      - name: Generate Programmatic SEO Pages & Sitemap from Candidate
        run: |
          python projects/GlobalSaaSHub/scripts/generate_seo_pages.py

      - name: Run Full-Corpus System Validation Audit (validate_system.py)
        run: |
          python projects/GlobalSaaSHub/scripts/validate_system.py

      - name: Atomic Swap tools.next.json to tools.json & Auto-commit to Main
        run: |
          if [ -f projects/GlobalSaaSHub/data/tools.next.json ]; then
            mv projects/GlobalSaaSHub/data/tools.next.json projects/GlobalSaaSHub/data/tools.json
            echo "✅ Atomic dataset swap completed: tools.next.json -> tools.json"
          fi
          git config user.name "GlobalSaaSHub-Bot"
          git config user.email "bot@coshuma.com"
          git add projects/GlobalSaaSHub/data/tools.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update tools.json database from daily AI discovery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi






      - name: Build Vite Production Assets
        run: |
          cd projects/GlobalSaaSHub
          npm run build


      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./projects/GlobalSaaSHub/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'GlobalSaaSHub-Bot'
          user_email: 'bot@coshuma.com'
          commit_message: 'auto-deploy [GitHub Actions 09:07 KST Daily Build]'
