name: Daily Automated Build & Deploy (GlobalSaaSHub)

on:
  # schedule:
  #   - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (true = discovery + validation + Artifact only, no deploy)'
        required: true
        type: boolean
        default: true
      approved_artifact_id:
        description: '[Production only] Artifact ID from approved dry-run (required when dry_run=false)'
        required: false
        type: string
        default: ''
      approved_artifact_sha256:
        description: '[Production only] SHA256 hex of approved Artifact ZIP (required when dry_run=false)'
        required: false
        type: string
        default: ''
      approved_head_sha:
        description: '[Production only] Git HEAD SHA of the approved dry-run commit (required when dry_run=false)'
        required: false
        type: string
        default: ''
      failure_test:
        description: 'Failure Test Mode (true = inject bad data, verify validate_data.py blocks pipeline)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-build-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:

      - name: Checkout Source Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'projects/GlobalSaaSHub/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd projects/GlobalSaaSHub
          npm ci

      # =========================================================
      # COMMON SAFETY GATE: Run all 4 deterministic test suites.
      # Runs in both dry_run and Production modes BEFORE any data processing.
      # Zero network calls. Exit 1 on any failure -> halts pipeline.
      # =========================================================
      - name: Run Deterministic Safety Test Suite (Gate)
        if: ${{ inputs.failure_test != true }}
        run: |
          python projects/GlobalSaaSHub/scripts/tests/test_affiliate_url_verifier.py
          python projects/GlobalSaaSHub/scripts/tests/test_affiliate_redirect.py
          python projects/GlobalSaaSHub/scripts/tests/test_affiliate_integration.py
          python projects/GlobalSaaSHub/scripts/tests/test_promote_approved_artifact.py
          python projects/GlobalSaaSHub/scripts/tests/test_validate_data_import_safety.py
          python projects/GlobalSaaSHub/scripts/tests/test_validate_data_input_selection.py
          python projects/GlobalSaaSHub/scripts/tests/test_pricing_integrity.py
          python projects/GlobalSaaSHub/scripts/tests/test_discovered_pricing_fail_closed.py
          python projects/GlobalSaaSHub/scripts/tests/test_discovery_staging.py
          python projects/GlobalSaaSHub/scripts/tests/test_domain_dedup.py
          python projects/GlobalSaaSHub/scripts/tests/test_manual_candidates_merge.py
          python projects/GlobalSaaSHub/scripts/tests/test_auto_aggregator_batch_retry.py
          python projects/GlobalSaaSHub/scripts/tests/test_auto_aggregator_ast_structure.py
          python projects/GlobalSaaSHub/scripts/tests/test_auto_aggregator_main_flow.py
          python projects/GlobalSaaSHub/scripts/tests/test_semantic_tools_audit.py
          python projects/GlobalSaaSHub/scripts/tests/test_content_audit.py
          python projects/GlobalSaaSHub/scripts/tests/test_homepage_claims.py
          python projects/GlobalSaaSHub/scripts/tests/test_link_integrity.py --source auto
          python projects/GlobalSaaSHub/scripts/tests/test_html_integrity.py

      # =========================================================
      # PRODUCTION SAFETY GATE
      # dry_run=false requires all three approval inputs AND approved_head_sha == github.sha.
      # Tavily/Gemini/auto_aggregator are NEVER called in Production.
      # =========================================================
      - name: "[Production] Verify Required Approval Inputs & Commit SHA Match"
        if: ${{ inputs.dry_run != true && inputs.failure_test != true }}
        run: |
          echo "=== Production mode: verifying approval inputs and commit SHA match ==="
          if [ -z "${{ inputs.approved_artifact_id }}" ]; then
            echo "FATAL: approved_artifact_id is required for Production (dry_run=false)."
            exit 1
          fi
          if [ -z "${{ inputs.approved_artifact_sha256 }}" ]; then
            echo "FATAL: approved_artifact_sha256 is required for Production (dry_run=false)."
            exit 1
          fi
          if [ -z "${{ inputs.approved_head_sha }}" ]; then
            echo "FATAL: approved_head_sha is required for Production (dry_run=false)."
            exit 1
          fi

          APPROVED_SHA_LOWER=$(echo "${{ inputs.approved_head_sha }}" | tr '[:upper:]' '[:lower:]')
          CURRENT_SHA_LOWER=$(echo "${{ github.sha }}" | tr '[:upper:]' '[:lower:]')

          echo "Approved Head SHA: $APPROVED_SHA_LOWER"
          echo "Current Github SHA:  $CURRENT_SHA_LOWER"

          HEX_REGEX="^[0-9a-f]{40}$"

          if [[ ! "$APPROVED_SHA_LOWER" =~ $HEX_REGEX ]]; then
            echo "FATAL: approved_head_sha '$APPROVED_SHA_LOWER' is not a valid 40-character hex string!"
            exit 1
          fi

          if [[ ! "$CURRENT_SHA_LOWER" =~ $HEX_REGEX ]]; then
            echo "FATAL: github.sha '$CURRENT_SHA_LOWER' is not a valid 40-character hex string!"
            exit 1
          fi

          if [ "$APPROVED_SHA_LOWER" != "$CURRENT_SHA_LOWER" ]; then
            echo "FATAL: approved_head_sha ($APPROVED_SHA_LOWER) does not match current github.sha ($CURRENT_SHA_LOWER). Main branch has moved!"
            exit 1
          fi

          echo "All approval inputs present and 40-hex HEAD SHA matched OK. Proceeding to artifact promotion."

      # Record current remote main SHA BEFORE any file generation.
      - name: Record Remote main SHA Baseline
        run: |
          git fetch origin main
          BASE_MAIN_SHA=$(git rev-parse origin/main)
          echo "BASE_MAIN_SHA=$BASE_MAIN_SHA" >> "$GITHUB_ENV"
          echo "Recorded BASE_MAIN_SHA: $BASE_MAIN_SHA"

      # =========================================================
      # PRODUCTION PATH: Download & verify approved Artifact only.
      # NO Tavily. NO Gemini. NO auto_aggregator. NO new data.
      # =========================================================
      - name: "[Production] Download & Validate Approved Artifact"
        if: ${{ inputs.dry_run != true && inputs.failure_test != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python projects/GlobalSaaSHub/scripts/promote_approved_artifact.py \
            --artifact-id "${{ inputs.approved_artifact_id }}" \
            --artifact-sha256 "${{ inputs.approved_artifact_sha256 }}" \
            --approved-head-sha "${{ inputs.approved_head_sha }}" \
            --repo "${{ github.repository }}" \
            --output-dir projects/GlobalSaaSHub/data

      # =========================================================
      # FAILURE TEST MODE: Skip external APIs entirely.
      # =========================================================
      - name: "[failure_test] Step 1 - Prepare Clean Candidate from tools.json"
        if: ${{ inputs.failure_test == true }}
        run: |
          cp projects/GlobalSaaSHub/data/tools.json \
             projects/GlobalSaaSHub/data/tools.next.json
          echo "Copied tools.json -> tools.next.json as baseline candidate."

      - name: "[failure_test] Step 2 - Baseline Validation (must PASS)"
        id: baseline_validate
        if: ${{ inputs.failure_test == true }}
        run: |
          set -o pipefail
          python projects/GlobalSaaSHub/scripts/validate_data.py \
            --input data/tools.next.json \
            2>&1 | tee projects/GlobalSaaSHub/data/baseline_validation.log
          echo "Baseline validation exit code: $?"
          if grep -q "VALIDATION RESULT: FAIL" projects/GlobalSaaSHub/data/baseline_validation.log; then
            echo "FATAL: Baseline tools.json failed validation BEFORE injection. Data must be clean first."
            exit 1
          fi
          echo "Baseline PASSED. Proceeding to inject bad data."

      - name: "[failure_test] Step 3 - Inject Duplicate ID into Candidate"
        if: ${{ inputs.failure_test == true && steps.baseline_validate.outcome == 'success' }}
        run: |
          python -c "
          import json
          path = 'projects/GlobalSaaSHub/data/tools.next.json'
          with open(path) as f:
              data = json.load(f)
          dup = dict(data[0])
          INJECTED_ID = data[0]['id']
          dup['name'] = 'INJECTED UNIQUE NAME FOR DUPLICATE ID TEST'
          dup['affiliate_url'] = 'https://duplicate-id-test.invalid/'
          data.append(dup)
          with open(path, 'w') as f:
              json.dump(data, f)
          print(f'Injected duplicate ID: {INJECTED_ID} with unique URL to isolate ID-only error.')
          "

      # =========================================================
      # DRY-RUN PATH: Real Tavily + Gemini discovery.
      # These steps are SKIPPED in Production (dry_run=false).
      # =========================================================
      - name: Execute Manual Candidate Pricing Verification (SSL & Evidence Check)
        if: ${{ inputs.dry_run == true && inputs.failure_test != true }}
        run: |
          python projects/GlobalSaaSHub/scripts/verify_manual_candidates.py

      - name: Execute Autonomous Tavily & Gemini AI Tool Discovery
        if: ${{ inputs.dry_run == true && inputs.failure_test != true }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: "true"
        run: |
          python projects/GlobalSaaSHub/scripts/auto_aggregator.py

      - name: Execute Autonomous Recategorization on Sandbox Candidate
        if: ${{ inputs.dry_run == true && inputs.failure_test != true }}
        run: |
          python projects/GlobalSaaSHub/scripts/recategorize_tools.py

      # =========================================================
      # MAIN VALIDATION (all modes)
      # =========================================================
      - name: Run Strict Candidate Dataset Validation Audit (validate_data.py)
        id: validate_data
        continue-on-error: true
        run: |
          set -o pipefail
          python projects/GlobalSaaSHub/scripts/validate_data.py \
            --input data/tools.next.json \
            2>&1 | tee projects/GlobalSaaSHub/data/normal_validation.log

      - name: Assert Validation Outcome Matches Expected Result
        run: |
          OUTCOME="${{ steps.validate_data.outcome }}"
          FAILURE_TEST="${{ inputs.failure_test }}"
          echo "validate_data outcome: $OUTCOME | failure_test: $FAILURE_TEST"

          if [ "$FAILURE_TEST" = "true" ]; then
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: failure_test=true but validate_data did NOT fail. Validator is NOT blocking bad data!"
              exit 1
            fi
            INJECTED_ID=$(python -c "import json; data=json.load(open('projects/GlobalSaaSHub/data/tools.next.json')); print(data[-1]['id'])")
            EXPECTED_MSG="Duplicate Tool ID found: '${INJECTED_ID}'"
            echo "Checking for exact error string: $EXPECTED_MSG"
            if grep -Fq "$EXPECTED_MSG" projects/GlobalSaaSHub/data/normal_validation.log; then
              echo "PASS: exact duplicate-ID error confirmed in log: $EXPECTED_MSG. Pipeline block verified."
            else
              echo "FAIL: exact error '$EXPECTED_MSG' NOT found in validation log."
              cat projects/GlobalSaaSHub/data/normal_validation.log
              exit 1
            fi
          else
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: validate_data failed on candidate data. Aborting pipeline."
              cat projects/GlobalSaaSHub/data/normal_validation.log
              exit 1
            fi
            echo "PASS: validate_data passed. Candidate data is clean."
          fi

      - name: Generate Programmatic SEO Pages & Sitemap from Candidate
        if: ${{ steps.validate_data.outcome == 'success' }}
        run: |
          python projects/GlobalSaaSHub/scripts/generate_seo_pages.py

      - name: Run Full-Corpus System Validation Audit (validate_system.py)
        if: ${{ steps.validate_data.outcome == 'success' }}
        run: |
          python projects/GlobalSaaSHub/scripts/validate_system.py \
            --input data/tools.next.json

      - name: Run Semantic tools.json Immutability Audit
        if: ${{ steps.validate_data.outcome == 'success' && inputs.failure_test != true }}
        run: |
          python projects/GlobalSaaSHub/scripts/semantic_tools_audit.py \
            --before projects/GlobalSaaSHub/data/tools.json \
            --after projects/GlobalSaaSHub/data/tools.next.json \
            --manifest projects/GlobalSaaSHub/data/semantic_audit_manifest.json

      - name: Promote Candidate to tools.json in Workspace (for Vite build)
        if: ${{ steps.validate_data.outcome == 'success' && inputs.failure_test != true }}
        run: |
          cp projects/GlobalSaaSHub/data/tools.next.json \
             projects/GlobalSaaSHub/data/tools.json
          echo "Workspace tools.json updated from candidate."

      - name: Build Vite Production Assets
        if: ${{ steps.validate_data.outcome == 'success' && inputs.failure_test != true }}
        run: |
          cd projects/GlobalSaaSHub
          npm run build

      - name: Upload Pipeline Artifacts
        if: ${{ inputs.dry_run == true && inputs.failure_test != true && steps.validate_data.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-artifacts-${{ github.run_id }}
          path: |
            projects/GlobalSaaSHub/data/tools.next.json
            projects/GlobalSaaSHub/data/run_summary.json
            projects/GlobalSaaSHub/data/semantic_audit_manifest.json
            projects/GlobalSaaSHub/data/content_audit_report.json
            projects/GlobalSaaSHub/data/content_audit_report.md
            projects/GlobalSaaSHub/data/content_semantic_diff.json
            projects/GlobalSaaSHub/data/new_tools_discovered.json
            projects/GlobalSaaSHub/data/price_updated_tools.json
            projects/GlobalSaaSHub/data/baseline_validation.log
            projects/GlobalSaaSHub/data/normal_validation.log
            projects/GlobalSaaSHub/public/sitemap.xml
            projects/GlobalSaaSHub/public/tool/
            projects/GlobalSaaSHub/public/compare/
          if-no-files-found: warn
          retention-days: 7

      # Production only: commit tools.json and push.
      - name: Atomic Swap & Commit tools.json to Main (Production Only)
        if: ${{ inputs.dry_run != true && inputs.failure_test != true && steps.validate_data.outcome == 'success' }}
        run: |
          if [ ! -f projects/GlobalSaaSHub/data/tools.next.json ]; then
            echo "FATAL: tools.next.json missing. Aborting production commit."
            exit 1
          fi
          cp projects/GlobalSaaSHub/data/tools.next.json \
             projects/GlobalSaaSHub/data/tools.json

          git config user.name "GlobalSaaSHub-Bot"
          git config user.email "bot@coshuma.com"
          git add projects/GlobalSaaSHub/data/tools.json
          if git diff --staged --quiet; then
            echo "No changes to tools.json. Skipping commit."
            exit 0
          fi
          git commit -m "chore(data): promote approved artifact to tools.json [skip ci]"

          git fetch origin main
          CURRENT_REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$CURRENT_REMOTE_SHA" != "$BASE_MAIN_SHA" ]; then
            echo "FATAL: main advanced from $BASE_MAIN_SHA to $CURRENT_REMOTE_SHA during workflow. Aborting."
            exit 1
          fi

          git push origin HEAD:main
          if [ $? -ne 0 ]; then
            echo "FATAL: git push rejected. Aborting deployment."
            exit 1
          fi
          echo "tools.json committed and pushed to main successfully."

      - name: Deploy to GitHub Pages (gh-pages)
        if: ${{ inputs.dry_run != true && inputs.failure_test != true && steps.validate_data.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./projects/GlobalSaaSHub/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'GlobalSaaSHub-Bot'
          user_email: 'bot@coshuma.com'
          commit_message: 'auto-deploy from approved artifact [GitHub Actions]'
