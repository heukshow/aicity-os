name: Daily Automated Build & Deploy (GlobalSaaSHub)

on:
  # schedule:
  #   - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (true = Skip DB commit & gh-pages deployment)'
        required: true
        type: boolean
        default: true
      failure_test:
        description: 'Failure Test Mode (true = inject bad data to verify validate_data.py blocks pipeline)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-build-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'projects/GlobalSaaSHub/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd projects/GlobalSaaSHub
          npm ci

      - name: Execute Autonomous Tavily & Gemini AI Tool Discovery
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python projects/GlobalSaaSHub/scripts/auto_aggregator.py

      - name: "[failure_test] Inject Invalid Candidate Data to Test Pipeline Block"
        if: ${{ inputs.failure_test == true }}
        run: |
          python -c "
          import json, os
          path = 'projects/GlobalSaaSHub/data/tools.next.json'
          if not os.path.exists(path):
            print('tools.next.json not found - creating minimal invalid dataset')
            data = []
          else:
            with open(path) as f:
              data = json.load(f)
          # Inject duplicate ID to force validation failure
          dup = data[0].copy() if data else {'id': 'dup-test', 'name': 'DUP TEST', 'affiliate_url': 'http://dup.com', 'rating': None}
          dup['id'] = data[0]['id'] if data else 'gohighlevel'
          dup['name'] = 'INJECTED DUPLICATE - SHOULD FAIL'
          data.append(dup)
          with open(path, 'w') as f:
            json.dump(data, f)
          print(f'Injected duplicate ID: {dup[\"id\"]}. validate_data.py should now FAIL.')
          "

      - name: Execute Autonomous Recategorization on Sandbox Candidate
        run: |
          python projects/GlobalSaaSHub/scripts/recategorize_tools.py

      - name: Run Strict Candidate Dataset Validation Audit (validate_data.py)
        run: |
          python projects/GlobalSaaSHub/scripts/validate_data.py

      - name: Generate Programmatic SEO Pages & Sitemap from Candidate
        run: |
          python projects/GlobalSaaSHub/scripts/generate_seo_pages.py

      - name: Run Full-Corpus System Validation Audit (validate_system.py)
        run: |
          python projects/GlobalSaaSHub/scripts/validate_system.py

      - name: Upload Dry-Run Artifacts (tools.next.json, summary, new tools, sitemap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-artifacts-${{ github.run_id }}
          path: |
            projects/GlobalSaaSHub/data/tools.next.json
            projects/GlobalSaaSHub/data/run_summary.json
            projects/GlobalSaaSHub/data/new_tools_discovered.json
            projects/GlobalSaaSHub/data/price_updated_tools.json
            projects/GlobalSaaSHub/public/sitemap.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Atomic Swap tools.next.json to tools.json & Auto-commit to Main
        if: ${{ inputs.dry_run != true && inputs.failure_test != true }}
        run: |
          if [ ! -f projects/GlobalSaaSHub/data/tools.next.json ]; then
            echo "FATAL: Mandatory candidate dataset projects/GlobalSaaSHub/data/tools.next.json is missing!"
            exit 1
          fi
          mv projects/GlobalSaaSHub/data/tools.next.json projects/GlobalSaaSHub/data/tools.json
          echo "Atomic dataset swap completed: tools.next.json -> tools.json"

          git config user.name "GlobalSaaSHub-Bot"
          git config user.email "bot@coshuma.com"
          git add projects/GlobalSaaSHub/data/tools.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update tools.json database from daily AI discovery [skip ci]"
            # Pull rebase BEFORE any file generation to avoid dirty working tree conflict
            git pull --rebase origin main
            git push origin HEAD:main
            if [ $? -ne 0 ]; then
              echo "FATAL: git push rejected (non-fast-forward). Aborting deployment."
              exit 1
            fi
          fi

      - name: Build Vite Production Assets
        if: ${{ inputs.failure_test != true }}
        run: |
          cd projects/GlobalSaaSHub
          npm run build

      - name: Deploy to GitHub Pages (gh-pages)
        if: ${{ inputs.dry_run != true && inputs.failure_test != true }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./projects/GlobalSaaSHub/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'GlobalSaaSHub-Bot'
          user_email: 'bot@coshuma.com'
          commit_message: 'auto-deploy [GitHub Actions 09:07 KST Daily Build]'
