name: COSHUMA YouTube Shorts Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coshuma-youtube-shorts.yml'
      - 'projects/GlobalSaaSHub/scripts/youtube_shorts/**'
      - 'projects/GlobalSaaSHub/scripts/tests/test_youtube_shorts_pipeline.py'
      - 'projects/GlobalSaaSHub/scripts/tests/test_youtube_shorts_render_upload.py'
      - 'projects/GlobalSaaSHub/data/youtube_shorts_*.json'
  pull_request:
    paths:
      - '.github/workflows/coshuma-youtube-shorts.yml'
      - 'projects/GlobalSaaSHub/scripts/youtube_shorts/**'
      - 'projects/GlobalSaaSHub/scripts/tests/test_youtube_shorts_pipeline.py'
      - 'projects/GlobalSaaSHub/scripts/tests/test_youtube_shorts_render_upload.py'
      - 'projects/GlobalSaaSHub/data/youtube_shorts_*.json'
  workflow_dispatch:
    inputs:
      render_tool:
        description: 'Optional tool id to render through quality gate (example: pictory). Leave blank to queue the next candidate.'
        required: false
        default: ''
        type: string
      upload_private:
        description: 'Upload the rendered Short as PRIVATE after quality gate. Requires existing YouTube OAuth repository secrets.'
        required: false
        default: false
        type: boolean

concurrency:
  group: coshuma-youtube-shorts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/GlobalSaaSHub
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install free media dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install pytest requests

      - name: Run Shorts tests
        run: python3 -m pytest scripts/tests/test_youtube_shorts_pipeline.py scripts/tests/test_youtube_shorts_render_upload.py -v

      - name: Compile all Shorts modules
        run: python3 -m py_compile scripts/youtube_shorts/*.py

      - name: Render Pictory smoke Short through quality gate on main
        if: ${{ github.event_name == 'push' }}
        run: python3 scripts/youtube_shorts/run_pipeline.py pictory

      - name: Upload Pictory smoke MP4 artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v6
        with:
          name: coshuma-short-pictory-smoke-${{ github.run_id }}
          path: projects/GlobalSaaSHub/data/youtube_shorts_output/*.mp4
          if-no-files-found: error
          retention-days: 3

      - name: Render requested Short through quality gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool != '' && inputs.upload_private != true }}
        run: python3 scripts/youtube_shorts/run_pipeline.py "${{ inputs.render_tool }}"

      - name: Verify OAuth secret presence for private upload
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool != '' && inputs.upload_private == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -e
          missing=0
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Private upload blocked safely. Configure the missing OAuth secrets after the channel owner completes Google's one-time consent flow."
            exit 1
          fi
          echo "Required YouTube OAuth secrets are present. Values were not printed."

      - name: Render, quality-gate, and upload requested Short as private
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool != '' && inputs.upload_private == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python3 scripts/youtube_shorts/run_pipeline.py "${{ inputs.render_tool }}" --upload-private

      - name: Upload rendered dry-run artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coshuma-short-${{ inputs.render_tool }}-${{ github.run_id }}
          path: projects/GlobalSaaSHub/data/youtube_shorts_output/*.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload private-upload manifest evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool != '' && inputs.upload_private == true }}
        uses: actions/upload-artifact@v6
        with:
          name: coshuma-short-upload-manifest-${{ inputs.render_tool }}-${{ github.run_id }}
          path: projects/GlobalSaaSHub/data/youtube_shorts_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Select next candidate and queue it
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool == '' }}
        run: python3 scripts/youtube_shorts/prepare_next_short.py

      - name: Open PR with queued selection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_tool == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if git diff --quiet -- data/youtube_shorts_manifest.json data/browser_required_queue.json; then
            echo "No new candidate selected. Nothing to do."
            exit 0
          fi
          BRANCH="automation/youtube-shorts-next-$(date -u +%Y%m%d%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add data/youtube_shorts_manifest.json data/browser_required_queue.json
          git commit -m "chore(youtube-shorts): queue next Shorts candidate [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "COSHUMA YouTube Shorts: queue next candidate" \
            --body "Auto-selected by the COSHUMA Shorts workflow. Adds one topic_selected manifest entry and a matching render/upload queue task. No video was uploaded to YouTube." \
            --base main \
            --head "$BRANCH"
