name: RECOVERY-006 Listing Admin Cleanup

on:
  push:
    branches:
      - governance/recovery-006-getresponse-boundary
    paths:
      - '.github/workflows/rec006-listing-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-legacy-listing-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5

      - name: Remove only legacy listing-admin containers
        working-directory: projects/GlobalSaaSHub
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0, 'scripts')
          from polish_public_copy import remove_listing_admin_blocks, _container_spans

          PAID_PROFILE = re.compile(
              r'(?:Claim|Request\s+updates\s+for)\s+[^\n<>]{1,80}\s+Profile\s*\(\$49/yr\)',
              re.I,
          )
          ADMIN_CONTEXT = re.compile(
              r'founder|claim(?:ing)?\s+(?:the|this)\s+(?:official\s+)?profile|'
              r'profile[- ]claim|manage\s+(?:product|pricing|profile|listing)',
              re.I,
          )

          def remove_paid_profile_controls(text: str) -> str:
              while True:
                  marker = PAID_PROFILE.search(text)
                  if not marker:
                      return text
                  candidates = []
                  for start, end in _container_spans(text):
                      if not (start <= marker.start() < end):
                          continue
                      block = text[start:end]
                      if PAID_PROFILE.search(block) and ADMIN_CONTEXT.search(block):
                          candidates.append((end - start, start, end))
                  if not candidates:
                      return text
                  _, start, end = min(candidates)
                  text = text[:start] + text[end:]

          changed = []
          for path in sorted(Path('public/tool').glob('*.html')):
              before = path.read_text(encoding='utf-8')
              after = remove_listing_admin_blocks(before)
              after = remove_paid_profile_controls(after)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'legacy listing-admin cleanup: changed_files={len(changed)}')
          for item in changed:
              print(item)
          PY
          python scripts/guard_raw_public_source.py

      - name: Commit cleaned tool source to the recovery branch
        run: |
          set -e
          if git diff --quiet -- projects/GlobalSaaSHub/public/tool; then
            echo 'No listing-admin source changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/GlobalSaaSHub/public/tool
          git commit -m 'RECOVERY-006: remove legacy listing-admin blocks from tool source'
          git push origin HEAD:governance/recovery-006-getresponse-boundary
