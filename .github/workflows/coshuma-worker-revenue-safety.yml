name: COSHUMA Worker Revenue Safety

on:
  push:
    branches: [main]
    paths:
      - 'projects/GlobalSaaSHub/worker/**'
      - '.github/workflows/coshuma-worker-revenue-safety.yml'
  workflow_dispatch:

concurrency:
  group: coshuma-worker-revenue-safety
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/GlobalSaaSHub/worker
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/GlobalSaaSHub/worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

      - name: Verify Cloudflare Worker bundle without deploying
        run: npm run deploy:check
