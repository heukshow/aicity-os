name: GlobalSaaSHub English-Only Guard

on:
  pull_request:
    paths:
      - 'projects/GlobalSaaSHub/**'
      - '.github/workflows/globalsaashub-english-only.yml'
  push:
    branches:
      - main
    paths:
      - 'projects/GlobalSaaSHub/**'
      - '.github/workflows/globalsaashub-english-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify GlobalSaaSHub stays English-only
        run: python projects/GlobalSaaSHub/scripts/tests/test_public_english_only.py
