name: COSHUMA Public Source Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coshuma-public-source-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Remove legacy internal operations copy from public source
        working-directory: projects/GlobalSaaSHub
        run: |
          set -e
          python scripts/sanitize_public_editorial_copy.py
          python scripts/clean_murf_customer_copy.py
          python scripts/clean_brand24_customer_copy.py
          python scripts/clean_offers_hub_customer_copy.py public
          python scripts/sanitize_public_partner_correspondence.py
          python scripts/sanitize_public_revenue_ops.py
          python scripts/sanitize_public_partner_status_labels.py

      - name: Fail closed on cleaned public source
        working-directory: projects/GlobalSaaSHub
        run: |
          set -e
          python scripts/guard_raw_public_source.py
          python scripts/validate_public_policy_contract.py

      - name: Commit cleaned public source only
        run: |
          set -e
          if git diff --quiet -- projects/GlobalSaaSHub/public projects/GlobalSaaSHub/index.html; then
            echo 'Public source already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/GlobalSaaSHub/public projects/GlobalSaaSHub/index.html
          git commit -m 'fix(coshuma): clean public affiliate operations source [skip ci]'
          git push origin HEAD:main
