name: COSHUMA Pricing Backlog Revalidation

on:
  push:
    branches: [main]
    paths:
      - 'projects/GlobalSaaSHub/scripts/refresh_pricing_backlog.py'
      - 'projects/GlobalSaaSHub/scripts/tests/test_pricing_backlog_refresh.py'
      - '.github/workflows/coshuma-pricing-refresh.yml'
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coshuma-pricing-backlog-revalidation
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Verify deterministic pricing evidence rules
        working-directory: projects/GlobalSaaSHub
        run: python scripts/tests/test_pricing_backlog_refresh.py
      - name: Revalidate a bounded pricing backlog batch
        working-directory: projects/GlobalSaaSHub
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRICING_REFRESH_BATCH: '10'
        run: python scripts/refresh_pricing_backlog.py
      - name: Validate both source datasets
        working-directory: projects/GlobalSaaSHub
        run: |
          python scripts/validate_data.py --input data/tools.json
          python scripts/validate_data.py --input data/tools.next.json
      - name: Persist only verified pricing updates and rotation state
        run: |
          set -e
          files=(
            projects/GlobalSaaSHub/data/tools.json
            projects/GlobalSaaSHub/data/tools.next.json
            projects/GlobalSaaSHub/data/pricing-refresh-state.json
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'No pricing refresh changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'data: refresh verified COSHUMA pricing evidence [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase --autostash origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Pricing refresh push race on attempt $attempt; retrying."
          done
          exit 1
