name: Temporary Regenerate COSHUMA Sitemap

on:
  push:
    branches:
      - fix/coshuma-regenerate-sitemap
    paths:
      - '.github/workflows/temp-regenerate-sitemap.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/coshuma-regenerate-sitemap
          fetch-depth: 0

      - name: Capture current sitemap URL set
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('projects/GlobalSaaSHub/public/sitemap.xml')
          text = path.read_text(encoding='utf-8')
          locs = re.findall(r'<loc>(.*?)</loc>', text)
          Path('/tmp/sitemap_locs_before.txt').write_text('\n'.join(locs) + '\n', encoding='utf-8')
          print(f'Before URL count: {len(locs)}')
          PY

      - name: Regenerate sitemap from current tools.json
        run: python projects/GlobalSaaSHub/scripts/generate_seo_pages.py --source tools.json

      - name: Verify regenerated sitemap semantics
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('projects/GlobalSaaSHub/public/sitemap.xml')
          text = path.read_text(encoding='utf-8')
          if '<lastmod>' in text:
              raise SystemExit('Generated sitemap still contains <lastmod>.')
          before = Path('/tmp/sitemap_locs_before.txt').read_text(encoding='utf-8').splitlines()
          after = re.findall(r'<loc>(.*?)</loc>', text)
          if len(after) != len(set(after)):
              raise SystemExit('Generated sitemap contains duplicate URLs.')
          before_set = set(before)
          after_set = set(after)
          removed = sorted(before_set - after_set)
          added = sorted(after_set - before_set)
          if removed:
              raise SystemExit('Regeneration removed existing sitemap URLs: ' + repr(removed[:10]))
          if len(added) > 5:
              raise SystemExit(f'Regeneration added too many URLs for an automatic scoped repair: {len(added)}')
          bad_added = [u for u in added if not (u.startswith('https://coshuma.com/compare/') and u.endswith('.html'))]
          if bad_added:
              raise SystemExit('Unexpected new sitemap URLs outside canonical compare pages: ' + repr(bad_added))
          print(f'After URL count: {len(after)}')
          print(f'Added canonical compare URLs ({len(added)}):')
          for url in added:
              print(url)
          print('No existing URLs removed; no stale lastmod values remain.')
          PY

      - name: Commit only regenerated sitemap
        run: |
          git config user.name 'COSHUMA-Sitemap-Bot'
          git config user.email 'bot@coshuma.com'
          git add projects/GlobalSaaSHub/public/sitemap.xml
          if git diff --cached --quiet; then
            echo 'Sitemap already matches generator output.'
            exit 0
          fi
          git commit -m 'fix(GlobalSaaSHub): regenerate sitemap without stale lastmod [skip ci]'
          git push origin HEAD:fix/coshuma-regenerate-sitemap
