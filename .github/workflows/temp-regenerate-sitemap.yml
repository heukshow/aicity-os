name: Temporary Regenerate COSHUMA Sitemap

on:
  push:
    branches:
      - fix/coshuma-regenerate-sitemap
    paths:
      - '.github/workflows/temp-regenerate-sitemap.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/coshuma-regenerate-sitemap
          fetch-depth: 0

      - name: Capture current sitemap URL set
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('projects/GlobalSaaSHub/public/sitemap.xml')
          text = path.read_text(encoding='utf-8')
          locs = re.findall(r'<loc>(.*?)</loc>', text)
          Path('/tmp/sitemap_locs_before.txt').write_text('\n'.join(locs) + '\n', encoding='utf-8')
          print(f'Before URL count: {len(locs)}')
          PY

      - name: Regenerate sitemap from current tools.json
        run: python projects/GlobalSaaSHub/scripts/generate_seo_pages.py --source tools.json

      - name: Verify scope is metadata-only
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('projects/GlobalSaaSHub/public/sitemap.xml')
          text = path.read_text(encoding='utf-8')
          if '<lastmod>' in text:
              raise SystemExit('Generated sitemap still contains <lastmod>.')
          before = Path('/tmp/sitemap_locs_before.txt').read_text(encoding='utf-8').splitlines()
          after = re.findall(r'<loc>(.*?)</loc>', text)
          if before != after:
              raise SystemExit(f'Sitemap URL set/order changed: before={len(before)} after={len(after)}; refusing automatic commit.')
          print(f'URL set unchanged at {len(after)} URLs; stale lastmod values removed.')
          PY

      - name: Commit only regenerated sitemap
        run: |
          git config user.name 'COSHUMA-Sitemap-Bot'
          git config user.email 'bot@coshuma.com'
          git add projects/GlobalSaaSHub/public/sitemap.xml
          if git diff --cached --quiet; then
            echo 'Sitemap already matches generator output.'
            exit 0
          fi
          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(['git', 'diff', '--cached', '--unified=0', '--', 'projects/GlobalSaaSHub/public/sitemap.xml'], text=True)
          changed = [line for line in diff.splitlines() if line.startswith(('+', '-')) and not line.startswith(('+++', '---'))]
          bad = [line for line in changed if not (line.startswith('-') and '<lastmod>' in line)]
          if bad:
              raise SystemExit('Unexpected sitemap diff outside lastmod removals: ' + repr(bad[:10]))
          print(f'Validated {len(changed)} lastmod-only removals.')
          PY
          git commit -m 'fix(GlobalSaaSHub): regenerate sitemap without stale lastmod [skip ci]'
          git push origin HEAD:fix/coshuma-regenerate-sitemap
