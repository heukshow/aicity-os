name: COSHUMA Public Source Normalize

on:
  push:
    branches:
      - fix/coshuma-public-source-preflight
    paths:
      - '.github/workflows/coshuma-public-source-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/coshuma-public-source-preflight
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Normalize customer-facing source
        working-directory: projects/GlobalSaaSHub
        run: |
          python scripts/guard_customer_only_copy.py
          python scripts/sanitize_public_editorial_copy.py
          python scripts/clean_murf_customer_copy.py
          python scripts/clean_brand24_customer_copy.py
          python scripts/clean_offers_hub_customer_copy.py public
          python scripts/sanitize_public_partner_correspondence.py
          python scripts/sanitize_public_revenue_ops.py
          python scripts/sanitize_public_partner_status_labels.py
          node scripts/build_public_tools.mjs
          python scripts/guard_public_source_boundary.py
      - name: Persist normalized public source to stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/GlobalSaaSHub/public projects/GlobalSaaSHub/index.html projects/GlobalSaaSHub/src/generated/public-tools.json
          if git diff --cached --quiet; then
            echo 'No public source changes needed.'
          else
            git commit -m 'chore(coshuma): normalize committed public source [skip ci]'
            git push origin HEAD:fix/coshuma-public-source-preflight
          fi
