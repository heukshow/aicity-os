name: Temporary COSHUMA Live Sitemap Probe

on:
  push:
    branches:
      - royal-queue
    paths:
      - .github/workflows/tmp-coshuma-live-sitemap-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live sitemap
        shell: bash
        run: |
          set -euo pipefail
          url='https://coshuma.com/sitemap.xml'
          body="$(mktemp)"
          headers="$(mktemp)"
          code="$(curl -L --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")"
          echo "HTTP_STATUS=$code"
          grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true
          echo 'BODY_PREFIX_BEGIN'
          head -c 500 "$body" || true
          echo
          echo 'BODY_PREFIX_END'
          test "$code" = '200'
          url_count="$( (grep -o '<url>' "$body" || true) | wc -l | tr -d ' ')"
          sitemap_count="$( (grep -o '<sitemap>' "$body" || true) | wc -l | tr -d ' ')"
          lastmod_count="$( (grep -o '<lastmod>' "$body" || true) | wc -l | tr -d ' ')"
          echo "URL_COUNT=$url_count"
          echo "SITEMAP_COUNT=$sitemap_count"
          echo "LASTMOD_COUNT=$lastmod_count"
          if grep -Fq 'https://coshuma.com/compare/fliki-vs-outlierkit.html' "$body"; then echo 'FLIKI_OUTLIERKIT=present'; else echo 'FLIKI_OUTLIERKIT=missing'; fi
          if grep -Fq 'https://coshuma.com/compare/fliki-vs-tubebuddy.html' "$body"; then echo 'FLIKI_TUBEBUDDY=present'; else echo 'FLIKI_TUBEBUDDY=missing'; fi
          sha256sum "$body" | sed 's/^/SITEMAP_SHA256=/'
          test "$url_count" = '385'
          test "$lastmod_count" = '0'
          grep -Fq 'https://coshuma.com/compare/fliki-vs-outlierkit.html' "$body"
          grep -Fq 'https://coshuma.com/compare/fliki-vs-tubebuddy.html' "$body"
