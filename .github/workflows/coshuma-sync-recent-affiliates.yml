name: COSHUMA one-shot affiliate sync

on:
  push:
    branches:
      - fix/coshuma-sudowrite-static-affiliate
    paths:
      - .github/workflows/coshuma-sync-recent-affiliates.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coshuma-sudowrite-static-affiliate
          fetch-depth: 0

      - name: Sync verified affiliate metadata
        shell: bash
        run: |
          cd projects/GlobalSaaSHub
          python - <<'PY'
          import copy, json
          from pathlib import Path

          canonical_path = Path('data/tools.json')
          next_path = Path('data/tools.next.json')
          canonical = json.loads(canonical_path.read_text())
          next_tools = json.loads(next_path.read_text())
          by_id = {tool['id']: tool for tool in canonical}

          for tool in next_tools:
              source = by_id.get(tool.get('id'))
              if not source:
                  continue
              for key in list(tool):
                  if key.startswith('affiliate_'):
                      tool.pop(key, None)
              for key, value in source.items():
                  if key.startswith('affiliate_'):
                      tool[key] = copy.deepcopy(value)

          next_path.write_text(json.dumps(next_tools, indent=2) + '\n')
          PY

      - name: Regenerate crawler-visible SEO pages
        shell: bash
        run: |
          cd projects/GlobalSaaSHub
          python scripts/generate_seo_pages.py

      - name: Validate affiliate data and links
        shell: bash
        run: |
          cd projects/GlobalSaaSHub
          python scripts/tests/test_affiliate_data_contract.py
          python scripts/tests/test_link_integrity.py

      - name: Remove one-shot workflow and commit generated changes
        shell: bash
        run: |
          rm .github/workflows/coshuma-sync-recent-affiliates.yml
          git config user.name "heukshow"
          git config user.email "heukshow@github.com"
          git add projects/GlobalSaaSHub/data/tools.next.json projects/GlobalSaaSHub/public .github/workflows/coshuma-sync-recent-affiliates.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(GlobalSaaSHub): sync verified affiliate routes to static pages"
          git push origin HEAD:fix/coshuma-sudowrite-static-affiliate
