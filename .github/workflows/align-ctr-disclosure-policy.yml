name: Align CTR patches with homepage-only disclosure policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-ctr-disclosure-policy.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Remove CTR-level page disclosure generation and requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('projects/GlobalSaaSHub')
          p = root / 'scripts/apply_search_console_ctr_patches.py'
          t = p.read_text(encoding='utf-8')

          # Any customer-copy tuple whose source is an affiliate disclosure now
          # removes that legacy paragraph instead of replacing it with another one.
          t = re.sub(
              r"(\n\s*\(\n\s*['\"]Affiliate disclosure:[^\n]*\n)\s*['\"]Affiliate disclosure:[^\n]*\n(\s*\),)",
              lambda m: m.group(1) + "        '',\n" + m.group(2),
              t,
          )

          # Moosend/Brand24 checks must reject page-level disclosures, not require them.
          t = t.replace(
              "        if 'Affiliate disclosure:' not in text:\n            raise SystemExit(\"Moosend customer-copy patch failed: affiliate disclosure was lost\")\n",
              "        if 'Affiliate disclosure:' in text or 'data-affiliate-disclosure=' in text:\n            raise SystemExit(\"Moosend customer-copy patch failed: page-level affiliate disclosure was regenerated\")\n",
          )
          t = t.replace(
              "        if 'Affiliate disclosure:' not in text:\n            raise SystemExit(\"Brand24 customer-copy patch failed: affiliate disclosure was lost\")\n",
              "        if 'Affiliate disclosure:' in text or 'data-affiliate-disclosure=' in text:\n            raise SystemExit(\"Brand24 customer-copy patch failed: page-level affiliate disclosure was regenerated\")\n",
          )
          p.write_text(t, encoding='utf-8')

          # One-shot workflow removes itself.
          Path('.github/workflows/align-ctr-disclosure-policy.yml').unlink()

          # Verify no executed CTR assertion still requires disclosure presence.
          out = p.read_text(encoding='utf-8')
          bad = [
              "affiliate disclosure was lost",
              "if 'Affiliate disclosure:' not in text",
          ]
          found = [x for x in bad if x in out]
          if found:
              raise SystemExit('CTR disclosure migration incomplete: ' + ', '.join(found))
          print('CTR disclosure policy migration: PASS')
          PY
      - name: Commit migration
        run: |
          git config user.name 'COSHUMA automation'
          git config user.email 'support@coshuma.com'
          git add -A
          git commit -m 'Remove page-level disclosure logic from CTR patches'
          git push origin HEAD:main
